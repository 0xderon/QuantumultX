#!name=X 去广告
#!desc=移除 X (Twitter) 首页、详情、搜索、主页中的推广内容
#!author=0xderon
#!homepage=https://github.com/0xderon/QuantumultX
#!icon=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Twitter.png

# 重要：关闭 Quantumult X「兼容性增强」，否则 script-response-body 可能无效。
# 更新本资源后请「更新」并重载，再强制退出 X（Twitter）。
# 无需另加 [general]。继续使用已有的 udp_drop_list = 443, STUN, QUIC 即可。
#
# 只解密原生客户端实际请求的 API：api.x.com、api.twitter.com。
# GraphQL 路径是 /graphql/{queryId}/{operation}。网页版 x.com 不在此列，避免放大 MitM。
# 登录、发帖、私信接口没有写进下面的规则。

# ========== 首页（为你推荐 / 正在关注）==========
^https?:\/\/api\.(?:x\.com|twitter\.com)\/(?:i\/api\/)?graphql\/[^\/?#]+\/(?:HomeLatestTimeline|HomeTimeline)\/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js

# ========== 推文详情 ==========
^https?:\/\/api\.(?:x\.com|twitter\.com)\/(?:i\/api\/)?graphql\/[^\/?#]+\/TweetDetail\/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js

# ========== 搜索 ==========
^https?:\/\/api\.(?:x\.com|twitter\.com)\/(?:i\/api\/)?graphql\/[^\/?#]+\/SearchTimeline\/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js

# ========== 个人主页 ==========
^https?:\/\/api\.(?:x\.com|twitter\.com)\/(?:i\/api\/)?graphql\/[^\/?#]+\/(?:UserTweetsAndReplies|UserTweets)\/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js

# ========== 探索 / 趋势 ==========
^https?:\/\/api\.(?:x\.com|twitter\.com)\/(?:i\/api\/)?graphql\/[^\/?#]+\/(?:ExploreSidebar|ExplorePage|GenericTimelineById)\/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js

# ========== 列表信息流 ==========
^https?:\/\/api\.(?:x\.com|twitter\.com)\/(?:i\/api\/)?graphql\/[^\/?#]+\/ListLatestTweetsTimeline\/?(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js

# 旧版探索与地点趋势。脚本只删带推广标记的条目。
^https?:\/\/api\.(?:x\.com|twitter\.com)\/2\/guide\.json(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js
^https?:\/\/api\.(?:x\.com|twitter\.com)\/1\.1\/trends\/place\.json(?:\?|$) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/x-ad.js

hostname = api.x.com, api.twitter.com
