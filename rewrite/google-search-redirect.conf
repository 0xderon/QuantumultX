#!name=Google 搜索重定向
#!desc=将 Safari 使用的 Google 中国域名重定向到 Google.com
#!author=0xderon
#!homepage=https://github.com/0xderon/QuantumultX
#!icon=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png

# 保留原请求的路径、查询参数和搜索关键词，仅替换域名。
^https?:\/\/(?:www\.)?(?:g|google)\.cn url 302 https://www.google.com

hostname = g.cn, *.g.cn, google.cn, *.google.cn
