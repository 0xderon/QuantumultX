#!name=微博去广告
#!desc=移除微博信息流、热搜、发现页、评论区、红包浮窗及开屏广告
#!author=0xderon
#!homepage=https://github.com/0xderon/QuantumultX
#!icon=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Weibo.png

# 重要：请关闭 Quantumult X「兼容性增强」，否则 script-response-body 可能无法去掉微博广告。
# 脚本请指向 main（勿再钉死旧 commit），更新资源后重载配置。

# 微博信息流、发现、搜索、详情、评论、超话等
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/(?:cardlist|searchall|page|flowpage|messageflow|groups\/timeline|statuses\/(?:unread_)?friends(?:\/|_)timeline|statuses\/(?:container_timeline(?:_hot|_topic|_topicpage|_unread)?|container_detail(?:_comment|_mix|_forward)?|unread_hot_timeline|unread_topic_timeline|extend|video_mixtimeline|repost_timeline)|profile\/(?:me|container_timeline)|video\/(?:community_tab|remind_info|tiny_stream_video_list|tiny_stream_mid_detail)|checkin\/show|!\/live\/media_homelist|comments\/(?:build_comments|mix_comments)|container\/get_item|search\/(?:finder|container_timeline|container_discover)|groups\/allgroups\/v\d) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# 红包/必得浮窗（push/active 内 ug_red_paper）
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/push\/active url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# 微博开屏广告
^https?:\/\/(?:sdk|wb)app\.uve\.weibo\.com\/(?:interface\/sdk\/sdkad\.php|wbapplua\/wbpullad\.lua) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# ---------- 增量 reject（来自 ddgksf2013/WeiboAds，已去重） ----------
# > 首页「可能感兴趣」推广
^https?:\/\/api\.weibo\.cn\/\d\/statuses\/container_positive url reject-200
# > 首页顶部弹窗
^https?:\/\/api\.weibo\.cn\/\d\/push\/info url reject-200
# > 启动感兴趣弹窗
^https?:\/\/api\.weibo\.cn\/.*account\/recommend_interesttags url reject-dict
# > 首页顶部直播推荐
^https?:\/\/api\.weibo\.cn\/.*\/media_homelist url reject-200
# > 搜索页默认填充词
^https?:\/\/api\.weibo\.cn\/.*finder\/searchbarchange url reject-200
# > AD Preload
^https?:\/\/api\.weibo\.cn\/\d\/ad\/preload url reject-dict
# > 用户推荐弹窗
^https?:\/\/api\.weibo\.cn\/\d\/profile\/recommend_popuser url reject-dict
# > 每日开屏 realtime
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/realtime url reject-200
# > 开屏 preload（脚本处理）
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/preload url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js
# > 超话栏浮层 tip
^https?:\/\/api\.weibo\.cn\/.*discovery_home_bottom_getdotinfo url reject-dict
# > 左上角每日 tip
^https?:\/\/m?api\.weibo\.c(n|om)\/\d/push/daily url reject-dict
# > 应用内弹窗广告
^https?:\/\/(preload-click|preload-impression)\.uve\.weibo\.com\/(interface\/wbpullad\/wbpullad_click\.php|wbapplua\/get_wbpullad_log\.lua) url reject
# > sdkconfig
^https?:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkconfig\.php url reject
# > Spotlight
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/hot\/hours_spotlight url reject-dict

# ======= 分流/过滤（远程 rewrite 里通常不生效；请复制到本地 [filter_local]） ======= #
# host, adstrategy.biz.weibo.com, reject
# host-suffix, biz.weibo.com, reject
# host, bootpreload.uve.weibo.com, reject
# host, bootrealtime.uve.weibo.com, reject

hostname = api.weibo.cn, mapi.weibo.com, *.api.weibo.*, *.uve.weibo.com, boot.biz.weibo.com, bootpreload.uve.weibo.com, bootrealtime.uve.weibo.com, preload-click.uve.weibo.com, preload-impression.uve.weibo.com, sdkapp.uve.weibo.com, wbapp.uve.weibo.com
