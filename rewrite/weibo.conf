#!name=微博去广告
#!desc=移除微博信息流、发现页、超话、评论区、红包浮窗及开屏广告（适配 16.11.x）
#!author=0xderon
#!homepage=https://github.com/0xderon/QuantumultX
#!icon=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Weibo.png

# 重要：关闭 Quantumult X「兼容性增强」，否则 script-response-body 可能无效。
# 更新本资源后请「更新」并重载，再强制结束微博进程。

# ========== 发现页（热搜下 banner/视频广告）==========
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/search\/(?:finder|container_timeline|container_discover) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# ========== 详情页 pageHeader（大家都在搜 / 铁粉关系 / 中插广告）==========
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/statuses\/container_detail(?:\?|$|&) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/statuses\/extend url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# ========== 评论区 / 转发区 ==========
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/statuses\/(?:container_detail_comment|container_detail_mix) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/statuses\/container_detail_forward url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/comments\/(?:build_comments|mix_comments) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# ========== 超话 ==========
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/statuses\/container_timeline_topic(?:page)? url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# ========== 热搜 page / flowpage ==========
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/(?:page|flowpage)\? url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# ========== 信息流 / 搜索 / 其它通用 ==========
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/(?:cardlist|searchall|messageflow|groups\/timeline|statuses\/(?:unread_)?friends(?:\/|_)timeline|statuses\/(?:container_timeline_hot|container_timeline_unread|container_timeline\?|unread_hot_timeline|unread_topic_timeline|video_mixtimeline|repost_timeline)|profile\/(?:me|container_timeline)|video\/(?:community_tab|remind_info|tiny_stream_video_list|tiny_stream_mid_detail)|checkin\/show|!\/live\/media_homelist|container\/get_item|groups\/allgroups\/v\d) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# 红包/必得浮窗
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/push\/active url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# 开屏
^https?:\/\/(?:sdk|wb)app\.uve\.weibo\.com\/(?:interface\/sdk\/sdkad\.php|wbapplua\/wbpullad\.lua) url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/preload url script-response-body https://raw.githubusercontent.com/0xderon/QuantumultX/main/scripts/weibo-ad.js

# ========== reject 类 ==========
^https?:\/\/api\.weibo\.cn\/\d\/statuses\/container_positive url reject-200
^https?:\/\/api\.weibo\.cn\/\d\/push\/info url reject-200
^https?:\/\/api\.weibo\.cn\/.*account\/recommend_interesttags url reject-dict
^https?:\/\/api\.weibo\.cn\/.*\/media_homelist url reject-200
^https?:\/\/api\.weibo\.cn\/.*finder\/searchbarchange url reject-200
^https?:\/\/m?api\.weibo\.c(?:n|om)\/\d+\/!\/was\/finder\/searchbarchange url reject-dict
^https?:\/\/api\.weibo\.cn\/\d\/ad\/preload url reject-dict
^https?:\/\/api\.weibo\.cn\/\d\/profile\/recommend_popuser url reject-dict
^https?:\/\/boot.*weibo\.com\/v\d\/ad\/realtime url reject-200
^https?:\/\/api\.weibo\.cn\/.*discovery_home_bottom_getdotinfo url reject-dict
^https?:\/\/m?api\.weibo\.c(n|om)\/\d/push/daily url reject-dict
^https?:\/\/(preload-click|preload-impression)\.uve\.weibo\.com\/(interface\/wbpullad\/wbpullad_click\.php|wbapplua\/get_wbpullad_log\.lua) url reject
^https?:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk\/sdkconfig\.php url reject
^https?:\/\/m?api\.weibo\.c(n|om)\/\d\/hot\/hours_spotlight url reject-dict

# 分流请放到本地 [filter_local]：
# host, adstrategy.biz.weibo.com, reject
# host-suffix, biz.weibo.com, reject
# host, bootpreload.uve.weibo.com, reject
# host, bootrealtime.uve.weibo.com, reject

hostname = api.weibo.cn, mapi.weibo.com, *.api.weibo.*, *.uve.weibo.com, boot.biz.weibo.com, bootpreload.uve.weibo.com, bootrealtime.uve.weibo.com, preload-click.uve.weibo.com, preload-impression.uve.weibo.com, sdkapp.uve.weibo.com, wbapp.uve.weibo.com
